<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <!-- `file:` is listed alongside 'self' because Electron loads this page from
         a file:// URL, where Chromium does not reliably match 'self'. The Tauri
         build is additionally constrained by the CSP in tauri.conf.json. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'unsafe-inline'; img-src 'self' file: data:; connect-src ipc: http://ipc.localhost">
    <title>RemoteMouse Pro</title>
    <style>
        :root {
            --bg: rgba(255, 255, 255, 0.1);
            --accent: #007aff;
            --text: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.6);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: transparent;
            margin: 0;
            padding: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 280px;
            color: var(--text);
            overflow: hidden;
        }

        .glass-container {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 25px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h2 { margin: 0 0 10px 0; font-size: 18px; font-weight: 600; }
        p { color: var(--text-dim); font-size: 13px; line-height: 1.4; margin: 0 0 20px 0; }
        
        #qr-container {
            background-color: white;
            padding: 12px;
            border-radius: 16px;
            margin-bottom: 20px;
            width: 164px;
            height: 164px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        #url-container { width: 100%; }
        #url-label { font-size: 11px; color: var(--text-dim); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        #url {
            font-family: "SF Mono", Menlo, monospace;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 12px;
            font-size: 12px;
            color: var(--accent);
            word-break: break-all;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        #url:hover { background: rgba(255, 255, 255, 0.1); }
        #url:active { transform: scale(0.98); }

        .footer { margin-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 15px; width: 100%; }
        .quit-btn {
            font-size: 13px;
            color: #ff453a;
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px 15px;
            font-weight: 500;
            transition: opacity 0.2s;
        }
        .quit-btn:hover { opacity: 0.7; }

        #error-log { color: #ff453a; font-size: 11px; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="glass-container">
        <h2>RemoteMouse Pro</h2>
        <p>Scan to control your Mac from your iPhone.</p>
        
        <div id="qr-container">
            <div id="qrcode"></div>
        </div>

        <div id="url-container">
            <div id="url-label">Direct URL</div>
            <div id="url">
                <span id="url-text">Detecting...</span>
            </div>
            <div id="pin-container" style="margin-top: 15px;">
                <div id="url-label">Pairing PIN</div>
                <div id="pin" style="font-size: 22px; font-weight: 800; letter-spacing: 4px; color: var(--accent);">------</div>
            </div>
            <div id="error-log"></div>
        </div>

        <div class="footer">
            <button class="quit-btn" id="quit-btn">Quit RemoteMouse</button>
        </div>
    </div>

    <script src="qrcode.min.js"></script>
    <script src="popover.js"></script>
</body>
</html>
