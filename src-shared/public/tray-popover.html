<!DOCTYPE html>
<html>
<head>
    <style>
        :root {
            --bg: rgba(255, 255, 255, 0.1);
            --accent: #007aff;
            --text: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.6);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: transparent;
            margin: 0;
            padding: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 280px;
            color: var(--text);
            overflow: hidden;
        }

        .glass-container {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 25px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h2 { margin: 0 0 10px 0; font-size: 18px; font-weight: 600; }
        p { color: var(--text-dim); font-size: 13px; line-height: 1.4; margin: 0 0 20px 0; }
        
        #qr-container {
            background-color: white;
            padding: 12px;
            border-radius: 16px;
            margin-bottom: 20px;
            width: 164px;
            height: 164px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        #url-container { width: 100%; }
        #url-label { font-size: 11px; color: var(--text-dim); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        #url {
            font-family: "SF Mono", Menlo, monospace;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 12px;
            font-size: 12px;
            color: var(--accent);
            word-break: break-all;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        #url:hover { background: rgba(255, 255, 255, 0.1); }
        #url:active { transform: scale(0.98); }

        .footer { margin-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 15px; width: 100%; }
        .quit-btn {
            font-size: 13px;
            color: #ff453a;
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px 15px;
            font-weight: 500;
            transition: opacity 0.2s;
        }
        .quit-btn:hover { opacity: 0.7; }

        #error-log { color: #ff453a; font-size: 11px; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="glass-container">
        <h2>RemoteMouse Pro</h2>
        <p>Scan to control your Mac from your iPhone.</p>
        
        <div id="qr-container">
            <div id="qrcode"></div>
        </div>

        <div id="url-container">
            <div id="url-label">Direct URL</div>
            <div id="url" onclick="copyUrl()">
                <span id="url-text">Detecting...</span>
            </div>
            <div id="pin-container" style="margin-top: 15px;">
                <div id="url-label">Pairing PIN</div>
                <div id="pin" style="font-size: 24px; font-weight: 800; letter-spacing: 4px; color: var(--accent);">----</div>
            </div>
            <div id="error-log"></div>
        </div>

        <div class="footer">
            <button class="quit-btn" onclick="quitApp()">Quit RemoteMouse</button>
        </div>
    </div>

    <script src="qrcode.min.js"></script>
    <script>
        function displayError(msg) {
            const log = document.getElementById('error-log');
            if (log) {
                log.innerText = msg;
                log.style.display = 'block';
            }
        }

        let tauriInvoke = null;

        // Initialize App Logic (Electron or Tauri)
        (async function() {
            const tauri = window.__TAURI__;
            const isElectron = (typeof require !== 'undefined') || (window.require) || (navigator.userAgent.toLowerCase().indexOf(' electron/') > -1);

            if (tauri) {
                initTauri(window.__TAURI__);
            } else if (isElectron) {
                const electron = window.require ? window.require('electron') : (typeof require !== 'undefined' ? require('electron') : null);
                if (electron) initElectron(electron);
            } else {
                setTimeout(async () => {
                    if (window.__TAURI__) initTauri(window.__TAURI__);
                    else {
                        const e2 = window.require ? window.require('electron') : (typeof require !== 'undefined' ? require('electron') : null);
                        if (e2) initElectron(e2);
                        else displayError("Connection failed.");
                    }
                }, 1000);
            }
        })();

        async function initTauri(tauri) {
            tauriInvoke = tauri.core ? tauri.core.invoke : tauri.invoke;
            const getCurrentWindow = tauri.window ? tauri.window.getCurrentWindow : null;

            if (getCurrentWindow) {
                const appWindow = getCurrentWindow();
                if (appWindow && appWindow.listen) {
                    appWindow.listen('tauri://blur', () => appWindow.hide().catch(console.error));
                }
            }

            if (tauriInvoke) {
                try {
                    const info = await tauriInvoke('get_connection_info');
                    updateUI(info.url, null, info.pin);
                } catch (err) { displayError(err); }
            }
        }

        function initElectron(electron) {
            const { ipcRenderer } = electron;
            ipcRenderer.on('connection-info', (event, info) => updateUI(info.url, info.qrCodeDataUrl, info.pin));
            ipcRenderer.on('connection-error', (event, message) => displayError(message));
            ipcRenderer.send('get-connection-info');
        }

        function updateUI(url, qrDataUrl, pin) {
            document.getElementById('url-text').innerText = url;
            if (pin) document.getElementById('pin').innerText = pin;
            const qrContainer = document.getElementById("qrcode");
            qrContainer.innerHTML = ''; 

            if (qrDataUrl) {
                const img = document.createElement('img');
                img.src = qrDataUrl;
                img.style.width = '150px';
                img.style.height = '150px';
                qrContainer.appendChild(img);
            } else {
                const QRCodeLib = window.QRCode || (typeof QRCode !== 'undefined' ? QRCode : null);
                if (QRCodeLib) {
                    new QRCodeLib(qrContainer, { text: url, width: 150, height: 150 });
                }
            }
        }

        async function quitApp() {
            const tauri = window.__TAURI__;
            const invoke = tauriInvoke || (tauri ? (tauri.core ? tauri.core.invoke : tauri.invoke) : null);
            if (invoke) await invoke('quit_app');
            else {
                const electron = window.require ? window.require('electron') : null;
                if (electron && electron.ipcRenderer) electron.ipcRenderer.send('quit-app');
                else window.close();
            }
        }

        async function copyUrl() {
            const text = document.getElementById('url-text').innerText;
            if (text && text !== 'Detecting...') {
                await navigator.clipboard.writeText(text);
                const originalText = document.getElementById('url-text').innerText;
                document.getElementById('url-text').innerText = 'Copied!';
                setTimeout(() => { document.getElementById('url-text').innerText = originalText; }, 1500);
            }
        }
    </script>
</body>
</html>
