<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RemoteMouse Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="status-container" id="connection-status">
            <div id="status-dot"></div>
            <span id="status">Connecting...</span>
        </div>
        <div class="action-btns">
            <button id="keyboard-toggle" class="icon-btn" title="Toggle Keyboard">
                <svg viewBox="0 0 24 24"><path d="M20,7V17H4V7H20M20,5H4C2.89,5 2,5.89 2,7V17A2,2 0 0,0 4,19H20A2,2 0 0,0 22,17V7C22,5.89 21.1,5 20,5M11,8H13V10H11V8M11,11H13V13H11V11M8,8H10V10H8V8M8,11H10V13H8V11M5,8H7V10H5V8M5,11H7V13H5V11M14,8H16V10H14V8M14,11H16V13H14V11M17,8H19V10H17V8M17,11H19V13H17V11M8,14H16V16H8V14Z" /></svg>
            </button>
            <button id="session-toggle" class="icon-btn" title="Disconnect">
                <svg viewBox="0 0 24 24"><path d="M16.56,5.44L15.11,6.89C16.84,7.94 18,9.83 18,12A6,6 0 0,1 12,18A6,6 0 0,1 6,12C6,9.83 7.16,7.94 8.88,6.88L7.44,5.44C5.13,6.96 3.6,9.59 3.6,12.6A8.4,8.4 0 0,0 12,21A8.4,8.4 0 0,0 20.4,12.6C20.4,9.59 18.87,6.96 16.56,5.44M13,3H11V13H13V3Z" /></svg>
            </button>
        </div>
    </header>

    <main id="touchpad">
        <!-- Touch interaction happens here -->
    </main>

    <footer class="controls">
        <div class="slider-group">
            <div class="label-group">
                <span>Sensitivity</span>
                <span id="sensitivity-val">1.0x</span>
            </div>
            <input type="range" id="sensitivity" min="0.1" max="3.0" step="0.1" value="1.0">
        </div>
    </footer>

    <div id="keyboard-container">
        <input type="text" id="keyboard-input" placeholder="Type here..." autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>

    <script src="client.js"></script>
</body>
</html>
