name: Release
on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    outputs:
      release_id: ${{ steps.create_release.outputs.releaseId }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # The Tauri backend never loads robotjs, so skip native install scripts
      # rather than doing work whose output is discarded.
      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build Tauri App
        id: create_release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "RemoteMouse Pro ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false

  build-electron:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install

      - name: Make Electron App
        run: npm run electron:make

      - name: Upload Electron Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: false
          files: |
            out/make/**/*.dmg
            out/make/**/*.exe
            out/make/**/*.zip
            out/make/**/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    needs: [build-tauri, build-electron]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Publish Release
        uses: eregon/publish-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_id: ${{ needs.build-tauri.outputs.release_id }}

  cleanup-failed-release:
    needs: [build-tauri, build-electron]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      # `--cleanup-tag` shells out to git, so without a checkout this step
      # failed with "not a git repository" and the `|| echo` fallback turned
      # that into a green check, leaving failed releases behind.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete Failed Draft Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Build failed! Cleaning up draft release and tag..."
          if ! gh release view ${{ github.ref_name }} >/dev/null 2>&1; then
            echo "No release for ${{ github.ref_name }}; nothing to clean up."
            exit 0
          fi
          gh release delete ${{ github.ref_name }} --cleanup-tag -y
