name: Cleanup Stale Draft Releases
on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Stale Draft Releases
        uses: actions/github-script@v7
        with:
          script: |
            const daysToKeep = 2;
            const threshold = new Date(Date.now() - daysToKeep * 24 * 60 * 60 * 1000);
            
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            
            for (const release of releases.data) {
              if (release.draft && new Date(release.created_at) < threshold) {
                console.log(`Deleting stale draft release: ${release.name || release.tag_name}`);
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id,
                });
                
                // Also clean up the associated tag to prevent clutter
                if (release.tag_name) {
                  try {
                    await github.rest.git.deleteRef({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      ref: `tags/${release.tag_name}`
                    });
                    console.log(`Deleted tag: ${release.tag_name}`);
                  } catch (e) {
                    console.log(`Tag ${release.tag_name} could not be deleted (may have already been removed).`);
                  }
                }
              }
            }
