<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Remote Touchpad</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="touchpad">
        <div id="status">Connecting...</div>
        <div class="instructions">
            <span>Tap for left click</span><br>
            <span>2-finger tap for right click</span>
        </div>
    </div>
    <div id="controls">
        <div class="button-row">
            <button id="session-toggle">Disconnect</button>
            <button id="keyboard-toggle">Keyboard</button>
        </div>
        <div id="keyboard-container" class="hidden">
            <input type="text" id="keyboard-input" placeholder="Type here..." autocapitalize="off" autocorrect="off" spellcheck="false">
        </div>
        <div class="slider-group">
            <label for="sensitivity">Sensitivity</label>
            <input type="range" id="sensitivity" min="0.1" max="5.0" step="0.1" value="2.0">
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
